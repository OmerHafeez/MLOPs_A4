name: Fraud_Detection_CICD

# 1. Triggers (Kab chalna chahiye?)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # STAGE 1: Continuous Integration (Checking the code)
  CI_Stage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: |
          pip install pandas pytest scikit-learn xgboost lightgbm

      - name: Run Unit Tests & Linting
        run: |
          # Yahan tum apne tests chalaoge (e.g., check if data exists)
          pytest tests/

  # STAGE 2: Build & Package (Dockerizing)
  Build_Stage:
    needs: CI_Stage
    runs-on: ubuntu-latest
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t your-docker-id/fraud-detection-component:latest .
          docker push your-docker-id/fraud-detection-component:latest

  # STAGE 3: Continuous Deployment (Triggering Kubeflow)
  CD_Stage:
    needs: Build_Stage
    runs-on: ubuntu-latest
    steps:
      - name: Run Kubeflow Pipeline
        run: |
          # Yeh script tumhare pipeline.yaml ko Kubeflow engine pe submit karegi
          python run_pipeline_remote.py
